name: Publish Ingestion Docker Image to GHCR

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'ingestion/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Set up Docker Buildx for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # 4. Extract image metadata (tags, labels)
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}/ingestion
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 5. Build and push Docker image (multi-platform)
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./ingestion
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
