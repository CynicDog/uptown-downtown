[project]
name = "ingestion"
version = "0.1.0"
description = "MTA GTFS-Realtime ingestion into Delta Lake"
requires-python = ">=3.11,<3.12"

dependencies = [
  "requests>=2.31",
  "protobuf>=4.25",
  "pyspark==3.5.1",
  "delta-spark==3.2.0",
]

[tool.uv]
dev-dependencies = [
  "grpcio-tools",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mta_ingestion*"]
